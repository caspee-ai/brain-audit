name: CI

# Type-checks this repository's sources, rebuilds dist/brain-audit.mjs from them and checks it
# is the released bundle (test/mirror.test.mjs), then runs it end to end, on every Node the
# package supports. Actions are pinned by commit, their release tag in a comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # Type-checks the sources (tsconfig.json, strict).
      - run: npm run check

      - run: npm run build

      - run: npm test

      - run: npm pack --dry-run
        working-directory: cli/brain-audit
